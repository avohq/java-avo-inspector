plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.github.avohq'
version = '2.0.0'

repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' }
}

dependencies {
    implementation 'org.jetbrains:annotations:23.0.0'
    api 'org.json:json:20220320'

    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.9.0'
    testImplementation 'org.junit.platform:junit-platform-launcher:1.9.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
    withJavadocJar()
}

// Compile against the Java 8 API even when building on a newer JDK (javac 8 has no --release).
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:-options'
    if (JavaVersion.current().isJava9Compatible()) {
        options.release = 8
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}

test {
    useJUnitPlatform()
}

// libVersion on the wire comes from AvoInspectorVersion.VERSION (SPEC.md §7.3.3); keep it in step
// with the published artifact version.
tasks.register('verifyVersionConstant') {
    def versionFile = file('src/main/java/is/avo/inspector/AvoInspectorVersion.java')
    def projectVersion = project.version.toString()
    inputs.file(versionFile)
    doLast {
        def matcher = versionFile.text =~ /String VERSION = "([^"]+)"/
        if (!matcher.find() || matcher.group(1) != projectVersion) {
            throw new GradleException("AvoInspectorVersion.VERSION must equal the project version ${projectVersion}")
        }
    }
}
check.dependsOn verifyVersionConstant

// Conformance harness (runner-contract 1.1.0). Not part of the published artifact.
sourceSets {
    conformance {
        java.srcDir 'conformance/src/main/java'
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
    }
}

// HarnessTests runs the conformance harness in a child JVM. Child JVMs inherit a dead mock
// endpoint, so no test can reach api.avo.app (in-process tests: NoRealHostListener).
test {
    environment 'AVO_INSPECTOR_MOCK_ENDPOINT', 'http://127.0.0.1:1'
    dependsOn 'conformanceClasses'
    inputs.files(sourceSets.conformance.output)
    systemProperty 'avo.conformance.classpath', sourceSets.conformance.output.classesDirs.asPath
}

tasks.register('conformanceJar', Jar) {
    archiveFileName = 'avo-inspector-conformance.jar'
    destinationDirectory = layout.buildDirectory.dir('conformance')
    manifest { attributes 'Main-Class': 'is.avo.inspector.ConformanceHarness' }
    from sourceSets.main.output
    from sourceSets.conformance.output
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

wrapper {
    gradleVersion = "8.12"
    distributionType = Wrapper.DistributionType.ALL
}
